name: import-smoke

# Catches "wheel installs but `import scitex_session` blows up at runtime"
# — separate from the full pytest suite so a broken entry-point fails
# fast without paying for the matrix. Companion to `tests` — confirms
# the bare package (no extras) is `pip install -e .`-able and
# `import scitex_session` succeeds. Catches `[project] dependencies`
# drift that the test matrix masks because it installs `[all,dev]`.
#
# Thin caller of the org reusable (PS-231): `on:` / job id preserved
# verbatim from the pre-migration file; the body lives in
# scitex-ai/.github. `runs_on` passed explicitly so the runner decision
# stays locally visible (hosted: this job does a bare `pip install -e .`
# with no self-hosted-only needs).

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 17 * * *"  # nightly 17:00 UTC (~02:00 JST), off-peak
  workflow_dispatch:

jobs:
  install-check:
    name: import-smoke-on-ubuntu-py3-12
    uses: scitex-ai/.github/.github/workflows/import-smoke.yml@main
    with:
      runs_on: '["ubuntu-latest"]'
    secrets: inherit
