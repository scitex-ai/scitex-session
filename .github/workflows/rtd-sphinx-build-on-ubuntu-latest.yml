name: docs

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  rtd-sphinx-build:
    if: "!contains(github.event.head_commit.message, 'docs(sphinx_html): refresh from CI build')"
    uses: scitex-ai/.github/.github/workflows/rtd-sphinx-build.yml@103726f97249dcb1bf9c37ad235dec991a0399f9
    permissions:
      contents: write
      pull-requests: write
    with:
      runs_on: '["ubuntu-latest"]'
      docs_dir: docs/sphinx
      python_version: '3.11'
      required: true
      fail_on_warning: ${{ github.event_name == 'pull_request' }}
      upload_artifact: true
      # Preserve the shipped bundle through a reviewed update PR rather than
      # the old direct push. Main receives it through deliberate promotion.
      bundle_dir: ${{ github.ref == 'refs/heads/develop' && 'src/scitex_session/_sphinx_html' || '' }}
