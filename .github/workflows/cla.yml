name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAssistant:
    # Accepted shared consent dispatcher; preserve the original allowlist.
    uses: scitex-ai/.github/.github/workflows/cla.yml@49ecabbd7e6876f1712f43c1f6b901aa77f4b1ae
    with:
      runs_on: '["ubuntu-latest"]'
      owner_allowlist: 'bot*,ywatanabe1989,LLEmacs'
    secrets:
      GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
